[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/workbench",
    "crates/server",
    "crates/locald",
    "crates/agent-windows",
]

# Default members to build (excludes platform-specific agents)
default-members = [
    "crates/core",
    "crates/workbench",
    "crates/server",
    "crates/locald",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jbaker07/windows-incident-compiler"

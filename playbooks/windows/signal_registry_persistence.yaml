---
# playbooks/windows/signal_registry_persistence.yaml
# Detects registry persistence: Run keys, IFEO debuggers, Winlogon values and service paths.

id: signal_registry_persistence
title: 'Windows Registry Persistence'
family: persistence
version: "3.0"
description: |
  Detects registry based persistence (Sysmon 12, 13 and 14, Security 4657):
  - Run, RunOnce and RunOnceEx values
  - Image File Execution Options Debugger values (debugger hijacking)
  - Winlogon Shell, Userinit and Notify values
  - Service ImagePath or ServiceDll changes made by anything other than the
    Service Control Manager, Windows Installer or TrustedInstaller

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Sysmon 12, 13 and 14, or Security 4657 with registry auditing'

mitre:
  attack_version: "20.1"
  tactics:
    - persistence
    - privilege_escalation
  techniques:
    - id: T1547.001
      name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    - id: T1546.012
      name: 'Event Triggered Execution: Image File Execution Options Injection'
    - id: T1547.004
      name: 'Boot or Logon Autostart Execution: Winlogon Helper DLL'
    - id: T1543.003
      name: 'Create or Modify System Process: Windows Service'

rules:
  - name: 'Run or RunOnce Key Modified'
    severity: HIGH
    fact: RegistryMod
    match:
      - field: key
        regex: '(?i)\\software\\(wow6432node\\)?microsoft\\windows\\currentversion\\run(once)?(ex)?\\'
    techniques: [T1547.001]

  - name: 'IFEO Debugger Set'
    severity: CRITICAL
    fact: RegistryMod
    match:
      - field: key
        regex: '(?i)\\image file execution options\\[^\\]+\\debugger$'
    techniques: [T1546.012]

  - name: 'Winlogon Value Changed'
    severity: CRITICAL
    fact: RegistryMod
    match:
      - field: key
        regex: '(?i)\\windows nt\\currentversion\\winlogon\\(shell|userinit|notify)'
    techniques: [T1547.004]

  - name: 'Service Path Changed Outside the Service Manager'
    severity: HIGH
    fact: RegistryMod
    match:
      - field: key
        regex: '(?i)\\currentcontrolset\\services\\[^\\]+\\(imagepath|parameters\\servicedll)$'
    exclude:
      - field: process_image
        in: ['services.exe', 'msiexec.exe', 'TrustedInstaller.exe']
    techniques: [T1543.003]

# Analyst guidance below is documentation. The engine does not execute it.
response:
- type: snapshot_registry
  target: registry_hive
  action: backup
  description: Backup registry hive for forensics before remediation
- type: revert_registry
  target: registry_key
  action: remove_value
  description: Remove malicious registry value/key
- type: audit_log
  description: Log registry modification details and parent process chain
  fields:
  - registry_path
  - registry_value_data
  - modifying_process
  - process_command_line
  - parent_process
- type: alert
  channel: siem
  title: Registry Persistence Detected
  priority: high
remediation:
  steps:
  - 'Export suspicious registry key for analysis: ''reg export HKLM\key output.reg'''
  - 'Delete malicious registry value: ''reg delete HKLM\path\to\key /v ValueName /f'''
  - Search registry for additional IOCs using 'reg query HKLM /s /d' for file paths
  - 'Restart services if modified: ''net stop ServiceName && net start ServiceName'''
  - Verify Windows startup with 'msconfig' or Task Manager Startup tab
  - Analyze parent process that performed the modification (forensics)

---
# playbooks/windows/signal_bitsadmin_abuse.yaml
# Detects bitsadmin.exe used to download files or to set up BITS jobs.

id: signal_bitsadmin_abuse
title: 'BITSAdmin LOLBin Abuse'
family: command_and_control
version: "3.0"
description: |
  Detects abuse of bitsadmin.exe, a built in Windows tool, for:
  - Downloading files over HTTP or HTTPS (ingress tool transfer)
  - Creating BITS jobs and adding files to them
  - Setting a notify command line, which makes a BITS job run a program and
    survive reboots

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - command_and_control
    - stealth
    - persistence
    - execution
  techniques:
    - id: T1105
      name: 'Ingress Tool Transfer'
    - id: T1197
      name: 'BITS Jobs'

rules:
  - name: 'BITSAdmin Download'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'bitsadmin.exe'
      - field: cmdline
        regex: '(?i)/transfer\b.*https?://'
    techniques: [T1197, T1105]
    tags: [download, lolbin]

  - name: 'BITSAdmin Add File'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        equals: 'bitsadmin.exe'
      - field: cmdline
        regex: '(?i)/addfile\b'
    techniques: [T1197]
    tags: [bits_job]

  - name: 'BITSAdmin Create Job'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        equals: 'bitsadmin.exe'
      - field: cmdline
        regex: '(?i)/create\b'
    techniques: [T1197]
    tags: [bits_job]

  - name: 'BITSAdmin Notify Command'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'bitsadmin.exe'
      - field: cmdline
        regex: '(?i)/setnotifycmdline\b'
    techniques: [T1197]
    tags: [bits_persistence]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- WSUS and Windows Update operations
- Some enterprise software using BITS for updates
response:
- type: alert
  channel: siem
  title: BITSAdmin Abuse Detected
  priority: high

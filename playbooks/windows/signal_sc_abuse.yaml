---
# playbooks/windows/signal_sc_abuse.yaml
# Detects sc.exe creating or changing services, stopping security services, or creating remote services.

id: signal_sc_abuse
title: 'SC Service Manipulation'
family: persistence
version: "3.0"
description: |
  Detects abuse of sc.exe for:
  - Creating a service with a binary path
  - Changing the binary path of an existing service
  - Stopping, deleting or disabling Defender, firewall, Security Center, EDR
    sensor or EventLog services
  - Creating a service on a remote host (\\host create)
  - Creating a service whose binary lives in a temp or user folder

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - persistence
    - privilege_escalation
    - defense_impairment
    - lateral_movement
  techniques:
    - id: T1543.003
      name: 'Create or Modify System Process: Windows Service'
    - id: T1685
      name: 'Disable or Modify Tools'
    - id: T1685.001
      name: 'Disable or Modify Tools: Disable or Modify Windows Event Log'
    - id: T1021.002
      name: 'Remote Services: SMB/Windows Admin Shares'

rules:
  - name: 'Service Creation'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'sc.exe'
      - field: cmdline
        regex: '(?i)\bcreate\b.*\bbinpath\s*='
    techniques: [T1543.003]

  - name: 'Security Service Stopped or Disabled'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'sc.exe'
      - field: cmdline
        regex: '(?i)\b(stop|delete|config)\s+(windefend|mpssvc|wscsvc|sense|wdnissvc|wdboot|wdfilter|eventlog)\b'
    techniques: [T1685, T1685.001]

  - name: 'Service Binary Path Changed'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'sc.exe'
      - field: cmdline
        regex: '(?i)\bconfig\b.*\bbinpath\s*='
    techniques: [T1543.003]

  - name: 'Remote Service Creation'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'sc.exe'
      - field: cmdline
        regex: '(?i)\\\\[^\\\s]+\s+create\b'
    techniques: [T1543.003, T1021.002]

  - name: 'Service Binary in User Writable Path'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'sc.exe'
      - field: cmdline
        regex: '(?i)\bbinpath\s*=\s*"?[^"]*(%temp%|\\temp\\|\\appdata\\|\\users\\public\\)'
    techniques: [T1543.003]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- IT administrators managing services
- Software installation scripts
response:
- type: alert
  channel: siem
  title: SC.exe Abuse Detected
  priority: high

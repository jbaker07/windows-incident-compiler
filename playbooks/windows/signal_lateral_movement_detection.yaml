---
# playbooks/windows/signal_lateral_movement_detection.yaml
# Detects RDP, admin share, PsExec, WMI and WinRM lateral movement and Kerberoasting.

id: signal_lateral_movement_detection
title: 'Windows Lateral Movement Detection'
family: lateral_movement
version: "3.0"
description: |
  Detects lateral movement indicators within Windows environments:
  - Remote Desktop logons (4624 logon type 10) from another host
  - Access to the C$ and ADMIN$ administrative shares (5140, 5145)
  - PsExec style service execution (PSEXESVC.exe)
  - Shells started by the WMI provider host (remote WMI execution)
  - Processes started by the WinRM plugin host (PowerShell remoting)
  - An RDP logon followed by a shell for the same user
  - Kerberoasting: one account requesting RC4 service tickets for many
    different services in a minute (4769)

  IPC$ is left out of the share rule because normal domain traffic touches it
  constantly.

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4624, 4769, 5140 and 5145'
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - lateral_movement
    - execution
    - credential_access
  techniques:
    - id: T1021.001
      name: 'Remote Services: Remote Desktop Protocol'
    - id: T1021.002
      name: 'Remote Services: SMB/Windows Admin Shares'
    - id: T1021.006
      name: 'Remote Services: Windows Remote Management'
    - id: T1569.002
      name: 'System Services: Service Execution'
    - id: T1047
      name: 'Windows Management Instrumentation'
    - id: T1558.003
      name: 'Steal or Forge Kerberos Tickets: Kerberoasting'

rules:
  - name: 'Remote RDP Logon'
    severity: MEDIUM
    fact: AuthEvent
    match:
      - field: event_id
        equals: 4624
      - field: logon_type
        equals: 10
    exclude:
      - field: source_ip
        in: ['127.0.0.1', '::1', '-']
    techniques: [T1021.001]
    tags: [rdp_access]

  - name: 'Administrative Share Access'
    severity: HIGH
    fact: AuthEvent
    match:
      - field: event_id
        in: [5140, 5145]
      - field: ShareName
        regex: '(?i)\\(c|admin)\$$'
    techniques: [T1021.002]
    tags: [admin_share_access]

  - name: 'Kerberoasting Ticket Burst'
    severity: HIGH
    fact: AuthEvent
    threshold: 5
    distinct: ServiceName
    window_seconds: 60
    group_by: user
    match:
      - field: event_id
        equals: 4769
      - field: TicketEncryptionType
        in: ['0x17', '0x18']
    exclude:
      - field: ServiceName
        regex: '(?i)(\$$|^krbtgt$)'
    techniques: [T1558.003]
    tags: [kerberoasting, credential_theft]

  - name: 'PsExec Service Execution'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['psexesvc.exe', 'paexec.exe', 'remcomsvc.exe']
    techniques: [T1569.002, T1021.002]
    tags: [remote_code_execution]

  - name: 'WMI Remote Process Execution'
    severity: HIGH
    fact: Exec
    match:
      - field: parent_image
        equals: 'wmiprvse.exe'
      - field: image
        in: ['cmd.exe', 'powershell.exe', 'pwsh.exe']
    techniques: [T1047]
    tags: [remote_code_execution]

  - name: 'WinRM Remote Shell'
    severity: HIGH
    fact: Exec
    match:
      - field: parent_image
        equals: 'wsmprovhost.exe'
    techniques: [T1021.006]
    tags: [powershell_remoting]

  - name: 'RDP Logon Followed by Shell'
    severity: HIGH
    fact: AuthEvent
    window_seconds: 300
    group_by: user
    match:
      - field: event_id
        equals: 4624
      - field: logon_type
        equals: 10
    exclude:
      - field: source_ip
        in: ['127.0.0.1', '::1', '-']
    then:
      fact: Exec
      match:
        - field: image
          in: ['cmd.exe', 'powershell.exe', 'pwsh.exe', 'cscript.exe', 'wscript.exe']
    techniques: [T1021.001]
    tags: [interactive_shell]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Help desk staff using RDP to support users
- Service accounts that request many service tickets with RC4 on legacy domains
response:
- type: terminate_session
  target: rdp_session
  action: disconnect
  description: Disconnect suspicious RDP session
- type: block_ip
  target: source_ip
  action: firewall_block
  description: Block source IP at firewall/network edge
  duration: 24h
- type: reset_credentials
  target: compromised_account
  action: force_password_change
  description: Force password reset for potentially compromised account
  priority: high
- type: audit_log
  description: Extract full logon and process creation history
  fields:
  - source_ip
  - source_hostname
  - target_user
  - logon_type
  - logon_time
  - processes_created
  - network_connections
- type: alert
  channel:
  - siem
  - soc
  - ir_team
  title: Suspicious Lateral Movement Detected
  priority: high
remediation:
  steps:
  - Verify legitimacy of remote logon with user/manager
  - Check logon source (hostname) - resolve IP to asset
  - Review process creation events (4688) immediately after logon
  - Check for credential dumping (mimikatz, ntdsutil patterns)
  - Examine network connections from target system in same timeframe
  - Review file access events on high-value shares (C$, IPC$)
  - Scan source system for malware/compromise
  - 'If compromised: Isolate both source and target systems'
  - Perform incident response forensics on both endpoints
  - Review account logon history for other suspicious activities

---
# playbooks/windows/signal_office_child_process.yaml
# Detects Office applications starting shells, script engines or LOLBins.

id: signal_office_child_process
title: 'Office Application Child Process'
family: execution
version: "3.0"
description: |
  Detects suspicious child processes started by Office applications:
  - cmd.exe or PowerShell started by Word, Excel or PowerPoint
  - wscript, cscript or mshta started by an Office application
  - certutil, bitsadmin, rundll32 or regsvr32 started by an Office application
  - Outlook starting a shell or script engine

  These are the usual traces of a malicious macro or attachment. The parent
  comes from ParentImage (Sysmon 1) or ParentProcessName (Security 4688).

enabled: true
severity: CRITICAL
cooldown_seconds: 60

requires:
  - 'Sysmon 1, or Security 4688 with parent process name (Windows 10 and later)'

mitre:
  attack_version: "20.1"
  tactics:
    - execution
    - initial_access
  techniques:
    - id: T1204.002
      name: 'User Execution: Malicious File'
    - id: T1566.001
      name: 'Phishing: Spearphishing Attachment'

rules:
  - name: 'Office Spawns Shell'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['cmd.exe', 'powershell.exe', 'pwsh.exe']
      - field: parent_image
        in: ['winword.exe', 'excel.exe', 'powerpnt.exe']

  - name: 'Office Spawns Script Engine'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['wscript.exe', 'cscript.exe', 'mshta.exe']
      - field: parent_image
        in: ['winword.exe', 'excel.exe', 'powerpnt.exe', 'outlook.exe', 'msaccess.exe']

  - name: 'Office Spawns LOLBin'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['certutil.exe', 'bitsadmin.exe', 'rundll32.exe', 'regsvr32.exe']
      - field: parent_image
        in: ['winword.exe', 'excel.exe', 'powerpnt.exe', 'outlook.exe', 'msaccess.exe']

  - name: 'Outlook Spawns Process'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['cmd.exe', 'powershell.exe', 'pwsh.exe', 'mshta.exe', 'wscript.exe', 'cscript.exe']
      - field: parent_image
        equals: 'outlook.exe'
    techniques: [T1566.001]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Legitimate Office add-ins executing scripts
- Mail merge operations
response:
- type: alert
  channel: siem
  title: Office Child Process Detected
  priority: critical

---
# playbooks/windows/signal_security_tool_disable.yaml
# Detects Defender, firewall, AMSI, EventLog or EDR protection being switched off or killed.

id: signal_security_tool_disable
title: 'Security Tool Disable'
family: defense_impairment
version: "3.0"
description: |
  Detects attempts to disable security tools:
  - Windows Defender switched off by PowerShell, sc.exe or net.exe
  - Defender exclusions added for a path, process or extension
  - Windows Firewall switched off with netsh or Set-NetFirewallProfile
  - The EventLog service stopped
  - AMSI bypass strings on a command line
  - Antivirus or EDR processes killed with taskkill /f

  ATT&CK v19 moved Disable or Modify Tools to T1685 under Defense Impairment and
  the firewall technique to T1686.

enabled: true
severity: CRITICAL
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - defense_impairment
    - stealth
  techniques:
    - id: T1685
      name: 'Disable or Modify Tools'
    - id: T1685.001
      name: 'Disable or Modify Tools: Disable or Modify Windows Event Log'
    - id: T1686.003
      name: 'Disable or Modify System Firewall: Windows Host Firewall'
    - id: T1564.012
      name: 'Hide Artifacts: File/Path Exclusions'

rules:
  - name: 'Disable Windows Defender'
    severity: CRITICAL
    fact: Exec
    any:
      - field: cmdline
        regex: '(?i)set-mppreference\b.*-disable\w+\s+(\$true|1)\b'
      - field: cmdline
        regex: '(?i)\b(sc|net1?)(\.exe)?"?\s+(stop|config)\s+windefend\b'
    techniques: [T1685]

  - name: 'Defender Exclusion Added'
    severity: HIGH
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)add-mppreference\b.*-exclusion(path|process|extension)\b'
    techniques: [T1564.012]

  - name: 'Disable Windows Firewall'
    severity: HIGH
    fact: Exec
    any:
      - field: cmdline
        regex: '(?i)\bnetsh(\.exe)?\b.*\bfirewall\s+set\s+opmode\s+(mode=)?disable\b'
      - field: cmdline
        regex: '(?i)\bnetsh(\.exe)?\b.*\badvfirewall\s+set\s+\w+\s+state\s+off\b'
      - field: cmdline
        regex: '(?i)set-netfirewallprofile\b.*-enabled\s+(false|0|\$false)\b'
    techniques: [T1686.003]

  - name: 'Stop Event Log Service'
    severity: CRITICAL
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\b(sc|net1?)(\.exe)?"?\s+stop\s+eventlog\b'
    techniques: [T1685.001]

  - name: 'AMSI Bypass Attempt'
    severity: CRITICAL
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)(amsiinitfailed|amsiscanbuffer|amsiutils|amsicontext)'
    techniques: [T1685]

  - name: 'Security Process Killed'
    severity: CRITICAL
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\btaskkill(\.exe)?\b.*\b(msmpeng|mssense|sensecncproxy|savservice|avp|mbam|csfalconservice|sentinelagent|cb)(\.exe)?\b'
      - field: cmdline
        regex: '(?i)\s/f\b'
    techniques: [T1685]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Authorized maintenance
- Software installation requiring temp disable
response:
- type: alert
  channel: siem
  title: Security Tool Disable Attempt
  priority: critical

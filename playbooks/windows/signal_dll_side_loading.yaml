---
# playbooks/windows/signal_dll_side_loading.yaml
# Detects DLLs loaded from temp folders and unsigned DLLs loaded from user writable folders.

id: signal_dll_side_loading
title: 'DLL Side-Loading Detection'
family: stealth
version: "3.0"
description: |
  Detects DLL side-loading and search order hijacking, where a legitimate
  executable loads an attacker DLL:
  - Any DLL loaded from a temp folder
  - Unsigned DLLs loaded from user writable folders (AppData, ProgramData,
    Users\Public, Downloads), outside the Microsoft subfolders

  ATT&CK v17 merged DLL Side-Loading (T1574.002) into T1574.001, now named DLL.

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Sysmon 7 (image load)'

mitre:
  attack_version: "20.1"
  tactics:
    - stealth
    - execution
  techniques:
    - id: T1574.001
      name: 'Hijack Execution Flow: DLL'

rules:
  - name: 'DLL Loaded from Temp Directory'
    severity: HIGH
    fact: ModuleLoad
    match:
      - field: path
        regex: '(?i)\\(temp|tmp)\\.*\.dll$'

  - name: 'Unsigned DLL from User Writable Path'
    severity: MEDIUM
    fact: ModuleLoad
    match:
      - field: path
        regex: '(?i)\\(users\\[^\\]+\\appdata|programdata|users\\public|downloads)\\.*\.dll$'
      - field: signed
        equals: false
    exclude:
      - field: path
        regex: '(?i)\\(appdata\\(local|roaming)\\microsoft|programdata\\microsoft)\\'

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Development environments
- Portable applications
response:
- type: alert
  channel: siem
  title: DLL Side-Loading Detected
  priority: high

---
# playbooks/windows/signal_schtasks_abuse.yaml
# Detects schtasks.exe creating tasks that run as SYSTEM, run remotely, or run shells from user folders.

id: signal_schtasks_abuse
title: 'Schtasks Persistence Abuse'
family: persistence
version: "3.0"
description: |
  Detects abuse of schtasks.exe for:
  - Creating a task that runs as SYSTEM
  - Creating a task on a remote host (/s)
  - Creating a logon or startup task that runs a shell or script engine
  - Creating a task that runs PowerShell
  - Creating a task that runs a program from a temp, AppData or public folder

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - persistence
    - execution
    - privilege_escalation
  techniques:
    - id: T1053.005
      name: 'Scheduled Task/Job: Scheduled Task'

rules:
  - name: 'Task Created to Run as SYSTEM'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'schtasks.exe'
      - field: cmdline
        regex: '(?i)/create\b.*/ru\s+"?(system|nt authority\\system)\b'

  - name: 'Remote Task Creation'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'schtasks.exe'
      - field: cmdline
        regex: '(?i)/create\b.*\s/s\s+\S+'

  - name: 'Logon or Startup Task Runs a Shell'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'schtasks.exe'
      - field: cmdline
        regex: '(?i)/create\b.*/sc\s+(onlogon|onstart)\b'
      - field: cmdline
        regex: '(?i)/tr\s+.*(cmd|powershell|pwsh|wscript|cscript|mshta)(\.exe)?\b'

  - name: 'Task Running PowerShell'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'schtasks.exe'
      - field: cmdline
        regex: '(?i)/create\b.*/tr\s+.*\b(powershell|pwsh)\b'

  - name: 'Task Running from User Writable Path'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'schtasks.exe'
      - field: cmdline
        regex: '(?i)/create\b.*/tr\s+.*(\\temp\\|%temp%|\\appdata\\|%appdata%|\\users\\public\\)'

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- IT deployment scripts creating legitimate tasks
- Backup software scheduling operations
response:
- type: alert
  channel: siem
  title: Schtasks Abuse Detected
  priority: high

---
# playbooks/windows/signal_file_staging.yaml
# Detects archive tools collecting data, password protected archives and archives dropped in staging folders.

id: signal_file_staging
title: 'File Staging Detection'
family: collection
version: "3.0"
description: |
  Detects data being collected and staged before exfiltration:
  - Archive tools (7-Zip, RAR) adding files to an archive
  - PowerShell Compress-Archive
  - Archives written into temp folders
  - Password protected archives
  - Archive files created in Users\Public, Windows\Temp or ProgramData

enabled: true
severity: MEDIUM
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'
  - 'Sysmon 11 for file creation'

mitre:
  attack_version: "20.1"
  tactics:
    - collection
  techniques:
    - id: T1560.001
      name: 'Archive Collected Data: Archive via Utility'
    - id: T1074.001
      name: 'Data Staged: Local Data Staging'

rules:
  - name: 'Archive Utility Execution'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        in: ['7z.exe', '7za.exe', '7zr.exe', 'rar.exe', 'winrar.exe']
      - field: cmdline
        regex: '(?i)\s(a|u)\s'
    techniques: [T1560.001]

  - name: 'PowerShell Compress-Archive'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)compress-archive'
    techniques: [T1560.001]

  - name: 'Archive Created in Temp'
    severity: HIGH
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\b(7z|7za|rar|compress-archive)\b.*\\(temp|tmp)\\'
    techniques: [T1560.001, T1074.001]

  - name: 'Password Protected Archive'
    severity: HIGH
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\b(7z|7za|rar)(\.exe)?\b.*\s-(p|hp)\S+'
    techniques: [T1560.001]

  - name: 'Archive Written to Staging Folder'
    severity: MEDIUM
    fact: CreatePath
    match:
      - field: path
        regex: '(?i)\\(users\\public|windows\\temp|programdata)\\[^\\]*\.(zip|7z|rar)$'
    techniques: [T1074.001]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- IT backup operations
- Developer build processes
response:
- type: alert
  channel: siem
  title: File Staging Detected
  priority: medium

---
# playbooks/windows/signal_wmic_abuse.yaml
# Detects wmic.exe creating processes, running XSL scripts, deleting shadow copies or uninstalling products.

id: signal_wmic_abuse
title: 'WMIC LOLBin Abuse'
family: execution
version: "3.0"
description: |
  Detects abuse of wmic.exe for:
  - Process creation (process call create)
  - XSL script execution through /format (Squiblytwo)
  - Shadow copy deletion, a common ransomware step before encryption
  - Running commands against a remote host (/node:)
  - Uninstalling products, often used to remove security software

  Shadow copy deletion maps to Inhibit System Recovery (T1490), so this playbook
  lists the Impact tactic.

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - execution
    - stealth
    - impact
    - defense_impairment
  techniques:
    - id: T1047
      name: 'Windows Management Instrumentation'
    - id: T1220
      name: 'XSL Script Processing'
    - id: T1490
      name: 'Inhibit System Recovery'
    - id: T1685
      name: 'Disable or Modify Tools'

rules:
  - name: 'WMIC Process Creation'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'wmic.exe'
      - field: cmdline
        regex: '(?i)\bprocess\s+call\s+create\b'
    techniques: [T1047]

  - name: 'WMIC XSL Script Execution'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'wmic.exe'
      - field: cmdline
        regex: '(?i)/format:\s*"?[^\s"]*(\.xsl\b|https?://)'
    techniques: [T1220]

  - name: 'WMIC Shadow Copy Delete'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'wmic.exe'
      - field: cmdline
        regex: '(?i)\bshadowcopy\s+delete\b'
    techniques: [T1490]

  - name: 'WMIC Remote Execution'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'wmic.exe'
      - field: cmdline
        regex: '(?i)/node:\s*"?[^\s"]+'
    techniques: [T1047]

  - name: 'WMIC Product Uninstall'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        equals: 'wmic.exe'
      - field: cmdline
        regex: '(?i)\bproduct\b.*\bcall\s+uninstall\b'
    techniques: [T1685]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- IT management scripts using WMIC for inventory
- Backup software shadow copy operations
response:
- type: alert
  channel: siem
  title: WMIC Abuse Detected
  priority: high

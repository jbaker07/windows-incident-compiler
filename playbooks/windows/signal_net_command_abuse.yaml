---
# playbooks/windows/signal_net_command_abuse.yaml
# Detects net.exe used to add accounts, enumerate shares and groups, or reach admin shares.

id: signal_net_command_abuse
title: 'Net Command Abuse'
family: discovery
version: "3.0"
description: |
  Detects suspicious net.exe and net1.exe usage for:
  - Domain group enumeration
  - Share enumeration
  - Adding local users and adding users to local groups
  - Mapping a remote administrative share
  - Deleting sessions or share connections to cover tracks
  - Resetting a password interactively

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - discovery
    - persistence
    - privilege_escalation
    - lateral_movement
    - stealth
  techniques:
    - id: T1069.002
      name: 'Permission Groups Discovery: Domain Groups'
    - id: T1087.002
      name: 'Account Discovery: Domain Account'
    - id: T1135
      name: 'Network Share Discovery'
    - id: T1136.001
      name: 'Create Account: Local Account'
    - id: T1098.007
      name: 'Account Manipulation: Additional Local or Domain Groups'
    - id: T1098
      name: 'Account Manipulation'
    - id: T1021.002
      name: 'Remote Services: SMB/Windows Admin Shares'
    - id: T1070.005
      name: 'Indicator Removal: Network Share Connection Removal'

rules:
  - name: 'Net Domain Group Enumeration'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        in: ['net.exe', 'net1.exe']
      - field: cmdline
        regex: '(?i)\b(group|user)\b.*\s/domain\b'
    exclude:
      - field: cmdline
        regex: '(?i)\s/(add|delete|del)\b'
    techniques: [T1069.002, T1087.002]

  - name: 'Net User Add'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['net.exe', 'net1.exe']
      - field: cmdline
        regex: '(?i)\buser\b.*\s/add\b'
    techniques: [T1136.001]

  - name: 'Net Localgroup Add'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['net.exe', 'net1.exe']
      - field: cmdline
        regex: '(?i)\blocalgroup\b.*\s/add\b'
    techniques: [T1098.007]

  - name: 'Net Share Enumeration'
    severity: MEDIUM
    fact: Exec
    threshold: 2
    distinct: cmdline
    window_seconds: 60
    group_by: user
    match:
      - field: image
        in: ['net.exe', 'net1.exe']
      - field: cmdline
        regex: '(?i)\b(share|view)\b'
    techniques: [T1135]

  - name: 'Net Use to Admin Share'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['net.exe', 'net1.exe']
      - field: cmdline
        regex: '(?i)\buse\b.*\\\\[^\\\s]+\\(c|admin)\$'
    exclude:
      - field: cmdline
        regex: '(?i)\s/del(ete)?\b'
    techniques: [T1021.002]

  - name: 'Net Session or Connection Delete'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        in: ['net.exe', 'net1.exe']
      - field: cmdline
        regex: '(?i)\b(session|use)\b.*\s/del(ete)?\b'
    techniques: [T1070.005]

  - name: 'Net User Password Reset'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['net.exe', 'net1.exe']
      - field: cmdline
        regex: '(?i)\buser\s+\S+\s+\*'
    techniques: [T1098]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- IT administrators managing users/shares
- Domain join operations
response:
- type: alert
  channel: siem
  title: Net Command Abuse Detected
  priority: high

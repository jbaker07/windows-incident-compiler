---
# playbooks/windows/signal_process_injection.yaml
# Detects remote thread injection and process image tampering.

id: signal_process_injection
title: 'Process Injection Detection'
family: stealth
version: "3.0"
description: |
  Detects process injection techniques including:
  - Remote thread creation (Sysmon 8), the core step of classic DLL injection
  - Remote threads created in system processes such as lsass or svchost
  - Remote threads created by programs running from user writable folders
  - Process image tampering (Sysmon 25), which is how process hollowing appears

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Sysmon 8 and Sysmon 25'

mitre:
  attack_version: "20.1"
  tactics:
    - stealth
    - privilege_escalation
  techniques:
    - id: T1055
      name: 'Process Injection'
    - id: T1055.001
      name: 'Process Injection: Dynamic-link Library Injection'
    - id: T1055.012
      name: 'Process Injection: Process Hollowing'

rules:
  - name: 'Remote Thread Creation'
    severity: HIGH
    fact: Injection
    match:
      - field: injection_type
        equals: 'remote_thread'
    exclude:
      - field: source_image
        regex: '(?i)\\(csrss|wininit|services|smss|MsMpEng)\.exe$'
    techniques: [T1055, T1055.001]

  - name: 'Injection into System Process'
    severity: CRITICAL
    fact: Injection
    match:
      - field: injection_type
        equals: 'remote_thread'
      - field: target_image
        regex: '(?i)\\(svchost|lsass|csrss|winlogon|services|explorer)\.exe$'
    exclude:
      - field: source_image
        regex: '(?i)\\(csrss|wininit|services|smss|MsMpEng)\.exe$'
    techniques: [T1055, T1055.001]

  - name: 'Injection from User Writable Path'
    severity: CRITICAL
    fact: Injection
    match:
      - field: injection_type
        equals: 'remote_thread'
      - field: source_image
        regex: '(?i)(\\temp\\|%temp%|\\appdata\\|%appdata%|\\users\\public\\|\\downloads\\)'
    techniques: [T1055, T1055.001]

  - name: 'Process Image Tampering'
    severity: HIGH
    fact: Injection
    match:
      - field: injection_type
        equals: 'process_hollowing'
    techniques: [T1055.012]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Security software
- Accessibility tools
response:
- type: alert
  channel: siem
  title: Process Injection Detected
  priority: critical

---
# playbooks/windows/signal_log_tamper_detection.yaml
# Detects Windows event logs being cleared, by event or by command.

id: signal_log_tamper_detection
title: 'Windows Event Log Clearing'
family: defense_impairment
version: "3.0"
description: |
  Detects attempts to erase Windows event logs:
  - The Security log cleared (1102) or another log cleared (System 104)
  - wevtutil cl, Clear-EventLog, Remove-EventLog, or the .NET
    EventLogSession ClearLog call on a command line
  - A shell started on the host followed by a log clear within five minutes

  Log clearing is a strong sign of post compromise activity. Treat it as a high
  priority incident.

enabled: true
severity: CRITICAL
cooldown_seconds: 60

requires:
  - 'Security 1102'
  - 'System 104'
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - defense_impairment
  techniques:
    - id: T1685.005
      name: 'Disable or Modify Tools: Clear Windows Event Logs'

rules:
  - name: 'Event Log Cleared'
    severity: CRITICAL
    fact: LogTamper
    match:
      - field: event_id
        in: [1102, 104]
    tags: [log_clear]

  - name: 'Log Clear Command'
    severity: CRITICAL
    fact: Exec
    any:
      - field: cmdline
        regex: '(?i)\bwevtutil(\.exe)?"?\s+(cl|clear-log)\b'
      - field: cmdline
        regex: '(?i)\b(clear-eventlog|remove-eventlog)\b'
      - field: cmdline
        regex: '(?i)eventlogsession\]::globalsession\.clearlog'
    tags: [log_clear_attempt]

  - name: 'Shell Followed by Log Clear'
    severity: CRITICAL
    fact: Exec
    window_seconds: 300
    group_by: host
    match:
      - field: image
        in: ['cmd.exe', 'powershell.exe', 'pwsh.exe', 'cscript.exe', 'wscript.exe']
    then:
      fact: LogTamper
      match:
        - field: event_id
          in: [1102, 104]
    tags: [chain]

# Analyst guidance below is documentation. The engine does not execute it.
response:
- type: freeze_evidence
  target: event_logs
  action: backup
  description: Immediately backup all event logs before further analysis
  priority: CRITICAL
- type: isolate_host
  target: endpoint
  action: network_isolation
  description: Isolate host from network pending forensics
  priority: CRITICAL
- type: preserve_memory
  target: host_memory
  action: dump
  description: Perform emergency memory dump for volatile evidence
- type: alert
  channel:
  - siem
  - soc
  - ir_team
  title: 'CRITICAL: Event Log Tampering Detected - Possible Breach'
  priority: critical
  escalation: immediate
remediation:
  steps:
  - 'IMMEDIATE: Isolate host from network while preserving connection for forensics'
  - 'Export all available event logs: ''Get-WinEvent -ListLog * | Export-EventLog'''
  - Check for log forwarding configuration (Event Log Forwarding to external server)
  - Search for backup event log files in %SYSTEMROOT%\System32\winevt\Logs\
  - Review process creation events (4688) within 1 hour BEFORE log clear attempt
  - Identify parent process of suspicious log clearing tool (chain of custody)
  - Check network logs for lateral movement/exfiltration in same timeframe
  - Engage incident response team for full forensic analysis
  - Review account lockout events (4740) for brute force activity
  - Check Windows Firewall logs for unauthorized connections

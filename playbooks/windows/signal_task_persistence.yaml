---
# playbooks/windows/signal_task_persistence.yaml
# Detects scheduled tasks created or updated with suspicious actions, and hidden tasks.

id: signal_task_persistence
title: 'Windows Task Scheduler Persistence'
family: persistence
version: "3.0"
description: |
  Detects creation or modification of scheduled tasks for persistence (Security
  4698 created and 4702 updated). The task XML is in TaskContent:
  - A new task whose action runs a shell, a script engine, rundll32, regsvr32, or
    a program in a temp, AppData or public folder
  - An existing task updated to such an action
  - A task marked Hidden in its settings

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4698 and 4702 (other object access auditing)'

mitre:
  attack_version: "20.1"
  tactics:
    - persistence
    - execution
    - privilege_escalation
  techniques:
    - id: T1053.005
      name: 'Scheduled Task/Job: Scheduled Task'

rules:
  - name: 'Scheduled Task Created With Suspicious Action'
    severity: HIGH
    fact: PersistArtifact
    match:
      - field: event_id
        equals: 4698
      - field: task_content
        regex: '(?is)<command>[^<]*(\\temp\\|\\appdata\\|\\users\\public\\|powershell|pwsh|cmd\.exe|mshta|wscript|cscript|rundll32|regsvr32)'

  - name: 'Scheduled Task Updated With Suspicious Action'
    severity: MEDIUM
    fact: PersistArtifact
    match:
      - field: event_id
        equals: 4702
      - field: task_content
        regex: '(?is)<command>[^<]*(\\temp\\|\\appdata\\|\\users\\public\\|powershell|pwsh|cmd\.exe|mshta|wscript|cscript|rundll32|regsvr32)'

  - name: 'Hidden Scheduled Task'
    severity: HIGH
    fact: PersistArtifact
    match:
      - field: event_id
        in: [4698, 4702]
      - field: task_content
        regex: '(?is)<hidden>\s*true\s*</hidden>'

# Analyst guidance below is documentation. The engine does not execute it.
response:
- type: block_execution
  target: scheduled_task
  description: Suspend newly created task pending review
- type: audit_log
  description: Log full task details for forensics
  fields:
  - task_name
  - author
  - executable_path
  - trigger_time
  - run_as_user
- type: alert
  channel: siem
  title: Suspicious Scheduled Task Detected
  priority: high
remediation:
  steps:
  - Review task creation context in Security event log (Event ID 4688)
  - Check parent process of task creation (schtasks.exe, PowerShell, etc.)
  - Verify task executable legitimacy and location
  - 'If malicious: Delete task via ''schtasks /delete /tn TaskName /f'''
  - Perform memory forensics on parent process if suspicious

---
# playbooks/windows/signal_regsvr32_abuse.yaml
# Detects regsvr32.exe running scriptlets (Squiblydoo) or DLLs from user writable folders.

id: signal_regsvr32_abuse
title: 'Regsvr32 LOLBin Abuse'
family: stealth
version: "3.0"
description: |
  Detects abuse of regsvr32.exe for:
  - Squiblydoo (/i: with scrobj.dll), which runs a COM scriptlet
  - Loading a scriptlet straight from a URL
  - Registering a DLL, OCX or scriptlet from a temp, AppData or public folder

  These are System Binary Proxy Execution (T1218.010). ATT&CK places that under
  Stealth, so this playbook no longer lists the Execution tactic.

enabled: true
severity: CRITICAL
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - stealth
  techniques:
    - id: T1218.010
      name: 'System Binary Proxy Execution: Regsvr32'

rules:
  - name: 'Regsvr32 Squiblydoo'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'regsvr32.exe'
      - field: cmdline
        regex: '(?i)/i:.*scrobj(\.dll)?'

  - name: 'Regsvr32 Remote Scriptlet'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'regsvr32.exe'
      - field: cmdline
        regex: '(?i)/i:\s*https?://'

  - name: 'Regsvr32 From User Writable Path'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'regsvr32.exe'
      - field: cmdline
        regex: '(?i)(\\temp\\|%temp%|\\appdata\\|%appdata%|\\users\\public\\|\\downloads\\)[^"]*\.(dll|ocx|sct)\b'

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Legitimate COM/DLL registration during software installation
- System maintenance operations
response:
- type: alert
  channel: siem
  title: Regsvr32 Abuse Detected
  priority: critical

---
# playbooks/windows/signal_group_membership_change.yaml
# Detects users added to privileged groups and new accounts being created.

id: signal_group_membership_change
title: 'Sensitive Group Membership Change'
family: persistence
version: "3.0"
description: |
  Detects changes to sensitive security groups (events 4728, 4732, 4756):
  - Administrators and Domain Admins
  - Enterprise Admins and Schema Admins
  - Backup Operators
  - Remote Desktop Users

  Also reports new user accounts (event 4720). In these events TargetUserName is
  the group name and MemberName is the account that was added.

enabled: true
severity: CRITICAL
cooldown_seconds: 60

requires:
  - 'Security 4720, 4728, 4732 and 4756 (account management auditing)'

mitre:
  attack_version: "20.1"
  tactics:
    - persistence
    - privilege_escalation
  techniques:
    - id: T1098.007
      name: 'Account Manipulation: Additional Local or Domain Groups'
    - id: T1136
      name: 'Create Account'

rules:
  - name: 'Admin Group Member Added'
    severity: CRITICAL
    fact: AuthEvent
    match:
      - field: event_id
        in: [4728, 4732, 4756]
      - field: TargetUserName
        regex: '(?i)^(administrators|domain admins)$'
    techniques: [T1098.007]
    tags: [admin_group]

  - name: 'Enterprise or Schema Admin Added'
    severity: CRITICAL
    fact: AuthEvent
    match:
      - field: event_id
        in: [4728, 4732, 4756]
      - field: TargetUserName
        regex: '(?i)^(enterprise admins|schema admins)$'
    techniques: [T1098.007]
    tags: [domain_escalation]

  - name: 'Remote Desktop Users Added'
    severity: MEDIUM
    fact: AuthEvent
    match:
      - field: event_id
        in: [4728, 4732, 4756]
      - field: TargetUserName
        regex: '(?i)^remote desktop users$'
    techniques: [T1098.007]
    tags: [rdp_access]

  - name: 'Backup Operators Added'
    severity: HIGH
    fact: AuthEvent
    match:
      - field: event_id
        in: [4728, 4732, 4756]
      - field: TargetUserName
        regex: '(?i)^backup operators$'
    techniques: [T1098.007]
    tags: [backup_escalation]

  - name: 'User Account Created'
    severity: MEDIUM
    fact: AuthEvent
    match:
      - field: event_id
        equals: 4720
    techniques: [T1136]
    tags: [account_created]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Legitimate user provisioning
- Scheduled admin rotations
response:
- type: alert
  channel: siem
  title: Sensitive Group Membership Changed
  priority: critical

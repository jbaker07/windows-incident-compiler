---
# playbooks/windows/signal_encoded_powershell.yaml
# Detects encoded, hidden and fileless PowerShell command lines.

id: signal_encoded_powershell
title: 'Encoded PowerShell Execution'
family: execution
version: "3.0"
description: |
  Detects encoded or obfuscated PowerShell commands commonly used in:
  - Initial access through malicious documents and scripts
  - Download cradles (IEX with DownloadString)
  - Hidden window launches with an encoded payload
  - Fileless loading of .NET assemblies through reflection

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - execution
    - stealth
  techniques:
    - id: T1059.001
      name: 'Command and Scripting Interpreter: PowerShell'
    - id: T1027.010
      name: 'Obfuscated Files or Information: Command Obfuscation'
    - id: T1564.003
      name: 'Hide Artifacts: Hidden Window'
    - id: T1620
      name: 'Reflective Code Loading'

rules:
  - name: 'Base64 Encoded Command'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)\s-e(c|nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{40,}'
    techniques: [T1059.001, T1027.010]

  - name: 'Download Cradle Pattern'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)\b(iex|invoke-expression)\b.*(downloadstring|net\.webclient|invoke-webrequest|\biwr\b|start-bitstransfer)'
    techniques: [T1059.001]

  - name: 'Hidden Window With Encoded Command'
    severity: CRITICAL
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\s-(nop|noprofile)\b'
      - field: cmdline
        regex: '(?i)\s-w(indowstyle)?\s+hidden\b'
      - field: cmdline
        regex: '(?i)\s-e(c|nc|ncodedcommand)?\s+\S'
    techniques: [T1059.001, T1564.003, T1027.010]

  - name: 'Reflection Assembly Load'
    severity: CRITICAL
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\[(system\.)?reflection\.assembly\]::load'
    techniques: [T1059.001, T1620]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Some legitimate deployment scripts use -EncodedCommand
- SCCM/ConfigMgr deployments may use encoded commands
- Validate parent process context before blocking
response:
- type: suspend_process
  target: process
  description: Suspend suspicious PowerShell process
- type: capture_memory
  target: process
  description: Capture process memory for analysis
- type: alert
  channel: siem
  title: Encoded PowerShell Detected
  priority: critical

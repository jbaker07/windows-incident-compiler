---
# playbooks/windows/signal_logon_anomaly.yaml
# Detects brute force, password spraying and unusual successful logons.

id: signal_logon_anomaly
title: 'Anomalous Logon Detection'
family: credential_access
version: "3.0"
description: |
  Detects anomalous logon patterns including:
  - Failed logon bursts against one account (password guessing)
  - Failed logons across many accounts from one source (password spraying)
  - One account logging on from three or more sources in an hour
  - Service accounts logging on interactively
  - RDP logons from public IP addresses

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4624 and 4625 (logon auditing)'

mitre:
  attack_version: "20.1"
  tactics:
    - credential_access
    - initial_access
  techniques:
    - id: T1110.001
      name: 'Brute Force: Password Guessing'
    - id: T1110.003
      name: 'Brute Force: Password Spraying'
    - id: T1078
      name: 'Valid Accounts'
    - id: T1133
      name: 'External Remote Services'

rules:
  - name: 'Failed Logon Burst'
    severity: HIGH
    fact: AuthEvent
    threshold: 5
    window_seconds: 300
    group_by: user
    match:
      - field: event_id
        equals: 4625
      - field: success
        equals: false
    techniques: [T1110.001]

  - name: 'Password Spray'
    severity: HIGH
    fact: AuthEvent
    threshold: 5
    distinct: user
    window_seconds: 300
    group_by: source_ip
    match:
      - field: event_id
        equals: 4625
      - field: success
        equals: false
    exclude:
      - field: source_ip
        in: ['-', '127.0.0.1', '::1']
    techniques: [T1110.003]

  - name: 'Multiple Logon Sources'
    severity: MEDIUM
    fact: AuthEvent
    threshold: 3
    distinct: source_ip
    window_seconds: 3600
    group_by: user
    match:
      - field: success
        equals: true
      - field: auth_type
        in: ['network', 'remote_interactive']
    exclude:
      - field: source_ip
        in: ['-', '127.0.0.1', '::1']
    techniques: [T1078]

  - name: 'Service Account Interactive Logon'
    severity: HIGH
    fact: AuthEvent
    match:
      - field: user
        regex: '(?i)^(svc[_-]|.*[_-]svc$)'
      - field: auth_type
        in: ['interactive', 'remote_interactive']
    techniques: [T1078]

  - name: 'RDP From Public IP'
    severity: CRITICAL
    fact: AuthEvent
    match:
      - field: auth_type
        equals: 'remote_interactive'
      - field: source_ip
        not_regex: '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.|169\.254\.|::1$|fe80:|fd|-$)'
    techniques: [T1133, T1078]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- VPN users with changing IPs
- Administrators with multiple jump hosts
response:
- type: alert
  channel: siem
  title: Logon Anomaly Detected
  priority: high

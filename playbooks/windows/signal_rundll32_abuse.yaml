---
# playbooks/windows/signal_rundll32_abuse.yaml
# Detects rundll32.exe running script, URL handlers, comsvcs MiniDump, or DLLs from user folders.

id: signal_rundll32_abuse
title: 'Rundll32 LOLBin Abuse'
family: stealth
version: "3.0"
description: |
  Detects abuse of rundll32.exe for:
  - JavaScript execution through mshtml
  - URL and shell handlers (url.dll, ieframe.dll, shell32 ShellExec_RunDLL)
  - comsvcs.dll MiniDump, which dumps LSASS memory
  - Running a DLL from a temp, AppData or public folder

  These are System Binary Proxy Execution (T1218.011), which ATT&CK places under
  Stealth. The MiniDump rule also maps to LSASS Memory (T1003.001).

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - stealth
    - credential_access
  techniques:
    - id: T1218.011
      name: 'System Binary Proxy Execution: Rundll32'
    - id: T1003.001
      name: 'OS Credential Dumping: LSASS Memory'

rules:
  - name: 'Rundll32 JavaScript Execution'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'rundll32.exe'
      - field: cmdline
        regex: '(?i)javascript:'
    techniques: [T1218.011]

  - name: 'Rundll32 URL or Shell Handler'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'rundll32.exe'
      - field: cmdline
        regex: '(?i)(url\.dll,\s*(fileprotocolhandler|openurl)|ieframe\.dll,\s*openurl|shell32\.dll,\s*shellexec_rundll)'
    techniques: [T1218.011]

  - name: 'Rundll32 Comsvcs MiniDump'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'rundll32.exe'
      - field: cmdline
        regex: '(?i)comsvcs(\.dll)?\W.*(minidump|#24)'
    techniques: [T1218.011, T1003.001]

  - name: 'Rundll32 DLL From User Writable Path'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'rundll32.exe'
      - field: cmdline
        regex: '(?i)(\\temp\\|%temp%|\\appdata\\|%appdata%|\\users\\public\\|\\downloads\\)[^,]*\.dll'
    techniques: [T1218.011]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Some legitimate software uses rundll32 for DLL execution
- Windows shell operations via Shell32.dll
response:
- type: alert
  channel: siem
  title: Rundll32 Abuse Detected
  priority: high

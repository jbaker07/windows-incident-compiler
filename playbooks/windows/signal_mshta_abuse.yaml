---
# playbooks/windows/signal_mshta_abuse.yaml
# Detects mshta.exe running inline script or remote HTA content.

id: signal_mshta_abuse
title: 'MSHTA LOLBin Abuse'
family: stealth
version: "3.0"
description: |
  Detects abuse of mshta.exe for:
  - Inline VBScript or JavaScript execution
  - Running a remote HTA file from a URL
  - about: protocol tricks that carry script inline

  These are System Binary Proxy Execution (T1218.005). ATT&CK places that under
  Stealth, so this playbook no longer lists the Execution tactic.

enabled: true
severity: CRITICAL
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - stealth
  techniques:
    - id: T1218.005
      name: 'System Binary Proxy Execution: Mshta'

rules:
  - name: 'MSHTA Inline Script'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'mshta.exe'
      - field: cmdline
        regex: '(?i)(vbscript|javascript):'

  - name: 'MSHTA Remote URL'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'mshta.exe'
      - field: cmdline
        regex: '(?i)https?://'

  - name: 'MSHTA About Protocol'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'mshta.exe'
      - field: cmdline
        regex: '(?i)about:\s*<'

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Rare legitimate use of HTA applications
- Legacy enterprise applications using HTA
response:
- type: block_execution
  target: process
  description: Terminate MSHTA with suspicious arguments
- type: alert
  channel: siem
  title: MSHTA Abuse Detected
  priority: critical

---
# playbooks/windows/signal_log_tampering.yaml
# Detects event logging being switched off: the EventLog service, log channels and audit policy.

id: signal_log_tampering
title: 'Windows Event Logging Disabled'
family: defense_impairment
version: "3.0"
description: |
  Detects attempts to stop Windows from recording events, which is quieter than
  clearing logs:
  - The EventLog service stopped or disabled with sc.exe or net.exe
  - A log channel disabled with wevtutil sl /e:false
  - Audit policy cleared or switched off with auditpol.exe
  - Audit policy changed (Security event 4719)

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'
  - 'Security 4719 (policy change auditing)'

mitre:
  attack_version: "20.1"
  tactics:
    - defense_impairment
  techniques:
    - id: T1685.001
      name: 'Disable or Modify Tools: Disable or Modify Windows Event Log'

rules:
  - name: 'EventLog Service Stopped or Disabled'
    severity: HIGH
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\b(sc|net1?)(\.exe)?"?\s+(stop|config)\s+eventlog\b'
    tags: [service_stop]

  - name: 'Event Log Channel Disabled'
    severity: HIGH
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\bwevtutil(\.exe)?"?\s+(sl|set-log)\b.*/e(nabled)?:false'
    tags: [channel_disabled]

  - name: 'Audit Policy Cleared or Disabled'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        equals: 'auditpol.exe'
      - field: cmdline
        regex: '(?i)(/clear|/remove|/set\b.*/(success|failure):disable)'
    tags: [audit_policy]

  - name: 'Audit Policy Changed'
    severity: HIGH
    fact: SecurityToolDisable
    match:
      - field: event_id
        equals: 4719
    tags: [audit_policy]

# Analyst guidance below is documentation. The engine does not execute it.
response:
- type: immediate_isolation
  description: Isolate host from network to prevent lateral movement
  actions:
  - Block outbound network traffic except to SIEM
  - Preserve volatile memory state
  - Snapshot disk for forensic analysis
- type: log_preservation
  description: Backup remaining event logs to protected location
  actions:
  - Export Security log to \\SIEM_SERVER\forensics
  - Export System log to protected share
  - Export PowerShell Operational log
  - Export Sysmon log for correlation
- type: process_termination
  target: suspicious_process
  description: Kill process/parent process chain
  recursive: true
- type: alert
  channel:
  - siem
  - email
  - slack
  title: 'CRITICAL: Event Log Tampering Detected'
  priority: critical
  escalation: immediate
remediation:
  steps:
  - DO NOT shut down system until forensics complete
  - Isolate system from network (disconnect network cable or firewall)
  - 'Collect memory dump: ''Invoke-WinPmem -OutputFile memory.dmp'''
  - Preserve disk image for forensic analysis
  - Check for persistence mechanisms installed during compromise
  - Review recent Windows Update patches installed
  - Analyze process execution chain to identify attack vector
  - Check for lateral movement attempts across network
  - Perform deep malware analysis on collected artifacts
  - Review access logs for unauthorized remote access

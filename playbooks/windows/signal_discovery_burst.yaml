---
# playbooks/windows/signal_discovery_burst.yaml
# Detects bursts of different discovery commands from one user in a short window.

id: signal_discovery_burst
title: 'Discovery Command Burst'
family: discovery
version: "3.0"
description: |
  Detects bursts of discovery commands often seen in:
  - Post exploitation reconnaissance
  - Automated attack tools
  - Red team frameworks

  Each rule counts distinct command lines from one user inside a short window,
  so the same command run again does not add to the count.

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - discovery
  techniques:
    - id: T1033
      name: 'System Owner/User Discovery'
    - id: T1087
      name: 'Account Discovery'
    - id: T1069
      name: 'Permission Groups Discovery'
    - id: T1016
      name: 'System Network Configuration Discovery'
    - id: T1049
      name: 'System Network Connections Discovery'
    - id: T1482
      name: 'Domain Trust Discovery'
    - id: T1615
      name: 'Group Policy Discovery'
    - id: T1082
      name: 'System Information Discovery'
    - id: T1057
      name: 'Process Discovery'

rules:
  - name: 'User Discovery Burst'
    severity: HIGH
    fact: Exec
    threshold: 3
    distinct: cmdline
    window_seconds: 60
    group_by: user
    match:
      - field: cmdline
        regex: '(?i)\b(whoami|quser|net1?(\.exe)?"?\s+(user|localgroup))\b'
    techniques: [T1033, T1087, T1069]

  - name: 'Network Discovery Burst'
    severity: MEDIUM
    fact: Exec
    threshold: 3
    distinct: cmdline
    window_seconds: 60
    group_by: user
    match:
      - field: cmdline
        regex: '(?i)\b(ipconfig|netstat|arp\s+-a|route\s+print|nbtstat)\b'
    techniques: [T1016, T1049]

  - name: 'Domain Discovery Burst'
    severity: HIGH
    fact: Exec
    threshold: 2
    distinct: cmdline
    window_seconds: 60
    group_by: user
    match:
      - field: cmdline
        regex: '(?i)\b(nltest|dsquery|gpresult)\b|\bnet1?(\.exe)?"?\s+(group|accounts|view)\b.*/domain'
    techniques: [T1087, T1069, T1482, T1615]

  - name: 'Combined Discovery Activity'
    severity: CRITICAL
    fact: Exec
    threshold: 5
    distinct: image
    window_seconds: 300
    group_by: user
    match:
      - field: image
        in: ['whoami.exe', 'hostname.exe', 'ipconfig.exe', 'systeminfo.exe', 'tasklist.exe', 'net.exe', 'net1.exe', 'nltest.exe', 'quser.exe', 'netstat.exe']
    techniques: [T1082, T1033, T1016, T1057, T1087]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- IT administrators troubleshooting
- Deployment scripts with inventory commands
response:
- type: alert
  channel: siem
  title: Discovery Burst Detected
  priority: high

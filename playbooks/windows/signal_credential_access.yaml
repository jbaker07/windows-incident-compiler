---
# playbooks/windows/signal_credential_access.yaml
# Detects credential dumping from LSASS, the SAM hive, NTDS.dit and Credential Manager.

id: signal_credential_access
title: 'Credential Access Detection'
family: credential_access
version: "3.0"
description: |
  Detects credential access attempts including:
  - Dump tools and Mimikatz style commands aimed at LSASS
  - comsvcs.dll MiniDump through rundll32
  - A process opening LSASS with access rights used for dumping (Sysmon 10)
  - Saving the SAM, SECURITY or SYSTEM hive with reg.exe
  - NTDS.dit access through shadow copies or ntdsutil
  - Repeated Credential Manager listing with cmdkey or vaultcmd

enabled: true
severity: CRITICAL
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'
  - 'Sysmon 10 for LSASS access'

mitre:
  attack_version: "20.1"
  tactics:
    - credential_access
  techniques:
    - id: T1003.001
      name: 'OS Credential Dumping: LSASS Memory'
    - id: T1003.002
      name: 'OS Credential Dumping: Security Account Manager'
    - id: T1003.003
      name: 'OS Credential Dumping: NTDS'
    - id: T1555.004
      name: 'Credentials from Password Stores: Windows Credential Manager'

rules:
  - name: 'LSASS Dump Tool'
    severity: CRITICAL
    fact: Exec
    any:
      - field: cmdline
        regex: '(?i)\bprocdump(64)?(\.exe)?\b.*\blsass'
      - field: cmdline
        regex: '(?i)(mimikatz|sekurlsa::|lsadump::|logonpasswords)'
    techniques: [T1003.001]
    tags: [credential_dump, lsass]

  - name: 'Comsvcs LSASS Dump'
    severity: CRITICAL
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)comsvcs(\.dll)?\W.*(minidump|#24)'
    techniques: [T1003.001]
    tags: [lsass_dump, lolbin]

  - name: 'LSASS Process Access'
    severity: CRITICAL
    fact: MemAlloc
    match:
      - field: target_image
        regex: '(?i)\\lsass\.exe$'
      - field: granted_access
        in: ['0x1010', '0x1410', '0x1438', '0x143a', '0x1fffff', '0x1f1fff', '0x1f3fff']
    exclude:
      - field: source_image
        regex: '(?i)\\(MsMpEng|MsSense|SenseIR)\.exe$'
    techniques: [T1003.001]
    tags: [lsass_access]

  - name: 'SAM Registry Export'
    severity: CRITICAL
    fact: Exec
    match:
      - field: cmdline
        regex: '(?i)\breg(\.exe)?"?\s+(save|export)\s+(hklm|hkey_local_machine)\\(sam|security|system)\b'
    techniques: [T1003.002]
    tags: [sam_export]

  - name: 'NTDS Access'
    severity: CRITICAL
    fact: Exec
    any:
      - field: cmdline
        regex: '(?i)ntds\.dit'
      - field: cmdline
        regex: '(?i)\bntdsutil\b.*\bifm\b'
      - field: cmdline
        regex: '(?i)\bvssadmin(\.exe)?"?\s+create\s+shadow\b'
    techniques: [T1003.003]
    tags: [ntds_theft]

  - name: 'Credential Manager Query'
    severity: MEDIUM
    fact: Exec
    threshold: 3
    window_seconds: 60
    group_by: user
    match:
      - field: cmdline
        regex: '(?i)\b(cmdkey|vaultcmd)(\.exe)?\b.*\s/(list|listcreds)'
    techniques: [T1555.004]
    tags: [credential_enum]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Legitimate admin backup of SAM
- Authorized penetration testing
response:
- type: alert
  channel: siem
  title: Credential Access Attempt
  priority: critical

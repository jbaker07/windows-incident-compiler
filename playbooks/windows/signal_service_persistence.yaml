---
# playbooks/windows/signal_service_persistence.yaml
# Detects new services whose binary runs a shell, lives in a user folder, or belongs to a remote admin tool.

id: signal_service_persistence
title: 'Windows Service Installation'
family: persistence
version: "3.0"
description: |
  Detects creation of Windows services for persistence (System 7045 and
  Security 4697):
  - The service command line runs cmd, PowerShell, mshta, rundll32 or regsvr32
  - The service binary is in a temp, AppData, ProgramData, Users\Public or
    Downloads folder
  - The service is a remote admin tool such as PsExec, PAExec or RemCom, or its
    binary sits on an admin share

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'System 7045, or Security 4697 (security system extension auditing)'

mitre:
  attack_version: "20.1"
  tactics:
    - persistence
    - privilege_escalation
    - execution
  techniques:
    - id: T1543.003
      name: 'Create or Modify System Process: Windows Service'
    - id: T1569.002
      name: 'System Services: Service Execution'

rules:
  - name: 'Service With Shell Command Line'
    severity: HIGH
    fact: PersistArtifact
    match:
      - field: artifact_type
        equals: 'service'
      - field: service_path
        regex: '(?i)(\bcmd(\.exe)?"?\s+/[ck]\b|%comspec%|\b(powershell|pwsh|mshta|rundll32|regsvr32)(\.exe)?\b)'
    techniques: [T1543.003]

  - name: 'Service Binary in User Writable Path'
    severity: CRITICAL
    fact: PersistArtifact
    match:
      - field: artifact_type
        equals: 'service'
      - field: service_path
        regex: '(?i)\\(temp|appdata|programdata|users\\public|downloads)\\'
    techniques: [T1543.003]

  - name: 'Remote Admin Tool Service'
    severity: HIGH
    fact: PersistArtifact
    match:
      - field: artifact_type
        equals: 'service'
    any:
      - field: service_name
        regex: '(?i)^(psexesvc|paexec|remcomsvc|csexecsvc)'
      - field: service_path
        regex: '(?i)\\(admin|c)\$\\|\\psexesvc\.exe'
    techniques: [T1543.003, T1569.002]

# Analyst guidance below is documentation. The engine does not execute it.
response:
- type: isolate_service
  target: service
  action: stop
  description: Stop suspicious service immediately
- type: preserve_evidence
  target: service_executable
  action: quarantine
  description: Quarantine service binary for analysis
- type: audit_log
  description: Extract full service details and modification history
  fields:
  - service_name
  - binary_path
  - display_name
  - start_type
  - service_account
- type: alert
  channel: siem
  title: Malicious Service Detected
  priority: critical
remediation:
  steps:
  - 'Stop the service: ''sc stop ServiceName'''
  - 'Delete the service: ''sc delete ServiceName'''
  - Quarantine the executable for malware analysis
  - Review system for lateral movement attempts (e.g., psexec)
  - Check for code injection via 'Get-Process | Select-Object -Property Handle,ProcessName'
  - Perform memory dump for artifact analysis

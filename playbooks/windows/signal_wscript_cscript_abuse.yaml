---
# playbooks/windows/signal_wscript_cscript_abuse.yaml
# Detects Windows Script Host running scripts from Office, user folders or the network.

id: signal_wscript_cscript_abuse
title: 'Windows Script Host Abuse'
family: execution
version: "3.0"
description: |
  Detects abuse of Windows Script Host (wscript.exe and cscript.exe) for:
  - Scripts started by an Office application
  - VBScript or JScript files run from temp, AppData, Downloads or public folders
  - Scripts run from a URL or a network share
  - Script engines starting PowerShell

  The Script Host runs both VBScript (T1059.005) and JScript (T1059.007).

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Sysmon 1, or Security 4688 with command line and parent process name'

mitre:
  attack_version: "20.1"
  tactics:
    - execution
  techniques:
    - id: T1059.005
      name: 'Command and Scripting Interpreter: Visual Basic'
    - id: T1059.007
      name: 'Command and Scripting Interpreter: JavaScript'

rules:
  - name: 'Script Host Spawned by Office'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['wscript.exe', 'cscript.exe']
      - field: parent_image
        in: ['winword.exe', 'excel.exe', 'powerpnt.exe', 'outlook.exe', 'msaccess.exe']

  - name: 'Script From User Writable Path'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['wscript.exe', 'cscript.exe']
      - field: cmdline
        regex: '(?i)(\\temp\\|%temp%|\\appdata\\|%appdata%|\\users\\public\\|\\downloads\\)[^"]*\.(vbs|vbe|js|jse|wsf|wsh)\b'

  - name: 'Script From URL or Network Share'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        in: ['wscript.exe', 'cscript.exe']
      - field: cmdline
        regex: '(?i)(https?://|\s"?\\\\[^\\\s]+\\)'

  - name: 'Script Engine Spawns PowerShell'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: parent_image
        in: ['wscript.exe', 'cscript.exe']

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- Legitimate login scripts
- IT automation VBScripts
response:
- type: alert
  channel: siem
  title: Script Host Abuse Detected
  priority: high

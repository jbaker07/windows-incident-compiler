---
# playbooks/windows/signal_certutil_abuse.yaml
# Detects certutil.exe used to download, encode, decode or clean up files.

id: signal_certutil_abuse
title: 'CertUtil LOLBin Abuse'
family: command_and_control
version: "3.0"
description: |
  Detects abuse of certutil.exe for:
  - File download with -urlcache or -verifyctl
  - Base64 decode (-decode, -decodehex) to unpack a payload
  - Base64 encode (-encode, -encodehex) to hide a file
  - Deleting the URL cache entry after a download

  CertUtil is a legitimate Windows tool but it is frequently abused as a LOLBin.

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'

mitre:
  attack_version: "20.1"
  tactics:
    - command_and_control
    - stealth
  techniques:
    - id: T1105
      name: 'Ingress Tool Transfer'
    - id: T1140
      name: 'Deobfuscate/Decode Files or Information'
    - id: T1027.013
      name: 'Obfuscated Files or Information: Encrypted/Encoded File'
    - id: T1070.004
      name: 'Indicator Removal: File Deletion'

rules:
  - name: 'CertUtil Download'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'certutil.exe'
      - field: cmdline
        regex: '(?i)-(urlcache|verifyctl)\b.*https?://'
    techniques: [T1105]
    tags: [download, lolbin]

  - name: 'CertUtil Decode Operation'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        equals: 'certutil.exe'
      - field: cmdline
        regex: '(?i)\s-decode(hex)?\b'
    techniques: [T1140]
    tags: [decode]

  - name: 'CertUtil Encode Operation'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        equals: 'certutil.exe'
      - field: cmdline
        regex: '(?i)\s-encode(hex)?\b'
    techniques: [T1027.013]
    tags: [encode]

  - name: 'CertUtil Cache Clear'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        equals: 'certutil.exe'
      - field: cmdline
        regex: '(?i)-urlcache\b.*\bdelete\b'
    techniques: [T1070.004]
    tags: [cleanup]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- PKI administrators using certutil legitimately
- Certificate enrollment operations
response:
- type: alert
  channel: siem
  title: CertUtil Abuse Detected
  priority: high

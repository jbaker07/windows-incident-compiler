---
# playbooks/windows/signal_powershell_download.yaml
# Detects PowerShell downloading content from the web, from the command line or a script block.

id: signal_powershell_download
title: 'PowerShell Download Activity'
family: command_and_control
version: "3.0"
description: |
  Detects PowerShell download patterns including:
  - WebClient DownloadString and DownloadFile
  - Invoke-WebRequest and its aliases (iwr, wget, curl)
  - IEX download cradles
  - BITS transfers through Start-BitsTransfer
  - The same download calls inside a logged script block (PowerShell 4104)

enabled: true
severity: HIGH
cooldown_seconds: 60

requires:
  - 'Security 4688 with command line, or Sysmon 1'
  - 'PowerShell 4104 script block logging'

mitre:
  attack_version: "20.1"
  tactics:
    - command_and_control
    - execution
    - stealth
    - persistence
  techniques:
    - id: T1105
      name: 'Ingress Tool Transfer'
    - id: T1059.001
      name: 'Command and Scripting Interpreter: PowerShell'
    - id: T1197
      name: 'BITS Jobs'

rules:
  - name: 'PowerShell DownloadString'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)downloadstring\s*\(.*https?://'
    techniques: [T1105, T1059.001]

  - name: 'PowerShell DownloadFile'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)downloadfile\s*\(.*https?://'
    techniques: [T1105, T1059.001]

  - name: 'PowerShell Invoke-WebRequest'
    severity: MEDIUM
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)\b(invoke-webrequest|iwr|wget|curl)\b.*https?://'
    techniques: [T1105, T1059.001]

  - name: 'PowerShell IEX Download Cradle'
    severity: CRITICAL
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)\b(iex|invoke-expression)\b.*(downloadstring|net\.webclient|invoke-webrequest)'
    techniques: [T1105, T1059.001]

  - name: 'PowerShell Start-BitsTransfer'
    severity: HIGH
    fact: Exec
    match:
      - field: image
        in: ['powershell.exe', 'pwsh.exe']
      - field: cmdline
        regex: '(?i)start-bitstransfer\b.*https?://'
    techniques: [T1105, T1197]

  - name: 'Script Block Download'
    severity: HIGH
    fact: ScriptExec
    match:
      - field: script_text
        regex: '(?i)(downloadstring|downloadfile|invoke-webrequest|net\.webclient|start-bitstransfer)'
    techniques: [T1105, T1059.001]

# Analyst guidance below is documentation. The engine does not execute it.
false_positives:
- IT automation scripts
- Package managers (chocolatey, nuget)
response:
- type: alert
  channel: siem
  title: PowerShell Download Detected
  priority: high
